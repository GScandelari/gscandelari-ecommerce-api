name: CI

# Lint, build e testes (Jest + Supertest contra o Firebase Emulator Suite)
# para cada um dos 3 microsservicos que compoem a API (services/orders,
# services/payments, services/notifications), rodando em matrix job. Este
# e o check obrigatorio de branch protection em `main` (ver
# CONTRIBUTING.md) - dispara em todo Pull Request e todo push para `main`,
# sem filtro de path, para que o check sempre exista independente do que
# o PR tenha tocado.
#
# NENHUM DEPLOY e feito por este workflow - ver `deploy-services.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, build e testes — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orders, payments, notifications]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Configurar Java (necessário para Firestore/Auth Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Build (TypeScript)
        run: npm run build

      - name: Testes (Jest + Supertest) contra o Firebase Emulator Suite
        # Mesmo padrão de functions/ci.yml: firebase-tools é devDependency
        # de cada serviço (via firebase-tools em npx, resolvido pelo
        # package-lock.json), rodando contra o projeto demo
        # "demo-gscandelari-ecommerce-api" (Auth + Firestore Emulator).
        # Nenhuma credencial nem projeto Firebase real é usado aqui.
        run: npm run test:coverage:emulator
